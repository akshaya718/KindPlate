
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Dashboard - KindPlate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>🥗 KindPlate</h2>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <section class="login-container">
        <h1>Donor Dashboard</h1>
        <p>Share surplus food and help someone in need.</p>

        <form id="donationForm">

            <input type="text" id="foodName"
                placeholder="Food Name" required>

            <select id="category" required>
                <option value="">Select Food Category</option>
                <option value="Cooked Food">Cooked Food</option>
                <option value="Fruits">Fruits</option>
                <option value="Vegetables">Vegetables</option>
                <option value="Bakery">Bakery Items</option>
                <option value="Packaged Food">Packaged Food</option>
            </select>

            <input type="number" id="quantity"
                placeholder="Quantity" min="1" required>

            <input type="text" id="unit"
                placeholder="Unit (plates, kg, packets)" required>

            <input type="datetime-local" id="pickupDeadline" required>

            <input type="text" id="location"
                placeholder="Pickup Location" required>

            <textarea id="foodDetails"
                placeholder="Preparation time and storage details"></textarea>

            <button type="submit">Add Donation</button>

        </form>

        <p id="donationMessage"></p>
    </section>

    <hr>

    <section class="login-container">
        <h2>Food Requests Received</h2>
        <p>Manage active requests and view previous records.</p>

        <div class="donor-request-layout">

            <div class="active-requests">
                <h3>Active Requests</h3>

                <div id="donorRequestList">
                    Loading requests...
                </div>
            </div>

            <div class="past-requests">
                <h3>Past Records</h3>

                <div id="pastRequestList">
                    Loading records...
                </div>
            </div>

        </div>
    </section>

    <script src="script.js"></script>
    <script type="module" src="donation-firestore.js"></script>
    <script type="module" src="donor-requests.js"></script>

</body>
</html>
